<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Elige una contrasena nueva">
  <meta name="theme-color" content="#101a2e">
  <title>Nueva contrasena · Emergency Response System</title>
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>

  <div class="auth">

    <aside class="auth__aside">
      <div class="auth__brand">
        <span class="auth__logo" aria-hidden="true">🚨</span>
        <div>
          <p class="auth__title">Emergency<br>Response System</p>
        </div>
      </div>
      <p class="auth__lead">
        Elige una contrasena nueva. Cerrara las sesiones abiertas en otros dispositivos.
      </p>
    </aside>

    <main class="auth__main">
      <div class="auth__card">
        <h1 class="auth__heading">Nueva contrasena</h1>
        <p class="auth__sub" id="sub">Minimo 8 caracteres, con mayuscula, minuscula y numero.</p>

        <div class="auth__alert" id="alert" role="alert">
          <span aria-hidden="true">⚠</span>
          <span id="alert-text"></span>
        </div>

        <form class="form" id="reset-form" novalidate>
          <div class="field">
            <label class="field__label" for="newPassword">Contrasena nueva</label>
            <input class="input" type="password" id="newPassword" name="newPassword"
                   autocomplete="new-password" required autofocus>
          </div>

          <div class="field">
            <label class="field__label" for="confirmPassword">Repite la contrasena</label>
            <input class="input" type="password" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" required>
          </div>

          <button type="submit" class="btn btn--primary btn--lg btn--block" id="btn-submit">
            Guardar contrasena
          </button>
        </form>

        <p class="auth__footer">
          <a href="/login.html">← Volver a iniciar sesion</a>
        </p>
      </div>
    </main>

  </div>

  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
