<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recupera tu contrasena del Emergency Response System">
  <meta name="theme-color" content="#101a2e">
  <title>Recuperar contrasena · Emergency Response System</title>
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>

  <div class="auth">

    <aside class="auth__aside">
      <div class="auth__brand">
        <span class="auth__logo" aria-hidden="true">🚨</span>
        <div>
          <p class="auth__title">Emergency<br>Response System</p>
        </div>
      </div>
      <p class="auth__lead">
        Te enviamos un enlace para elegir una contrasena nueva. Vale 30 minutos.
      </p>
    </aside>

    <main class="auth__main">
      <div class="auth__card">
        <h1 class="auth__heading">Recuperar contrasena</h1>
        <p class="auth__sub">Escribe el correo con el que te registraste.</p>

        <div class="auth__alert" id="alert" role="alert">
          <span aria-hidden="true">⚠</span>
          <span id="alert-text"></span>
        </div>

        <div class="auth__alert auth__alert--success" id="success" role="status">
          <span aria-hidden="true">✓</span>
          <span id="success-text"></span>
        </div>

        <form class="form" id="forgot-form" novalidate>
          <div class="field">
            <label class="field__label" for="email">Correo electronico</label>
            <input class="input" type="email" id="email" name="email"
                   autocomplete="username" placeholder="tucorreo@ejemplo.com"
                   required autofocus>
          </div>

          <button type="submit" class="btn btn--primary btn--lg btn--block" id="btn-submit">
            Enviar enlace
          </button>
        </form>

        <p class="auth__footer">
          <a href="/login.html">← Volver a iniciar sesion</a>
        </p>
      </div>
    </main>

  </div>

  <script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
