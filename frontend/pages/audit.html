<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bitacora de auditoria del sistema">
  <meta name="theme-color" content="#101a2e">
  <title>Auditoria · Emergency Response System</title>
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/tables.css">
</head>
<body>

  <div class="app-shell">
    <main class="app-main">
      <div class="page">

        <section class="panel panel--flush" aria-labelledby="audit-title">

          <div class="panel__head">
            <div>
              <h2 id="audit-title" class="panel__title">Auditoria</h2>
              <p class="text-muted" style="font-size: var(--text-xs);">
                Registro de quien hizo que y cuando. Solo lectura: no se puede editar ni borrar.
              </p>
            </div>
            <button type="button" class="btn btn--ghost btn--sm" id="btn-refresh">
              <span class="btn__icon" aria-hidden="true">⟳</span> Actualizar
            </button>
          </div>

          <div class="filters">
            <div class="field">
              <label class="field__label" for="f-action">Accion</label>
              <select class="select select--sm" id="f-action">
                <option value="">Todas</option>
              </select>
            </div>

            <div class="field">
              <label class="field__label" for="f-entity">Entidad</label>
              <select class="select select--sm" id="f-entity">
                <option value="">Todas</option>
                <option value="users">Usuarios</option>
                <option value="emergencies">Emergencias</option>
                <option value="responders">Personal</option>
                <option value="assignments">Asignaciones</option>
                <option value="system_settings">Configuracion</option>
              </select>
            </div>

            <div class="field">
              <label class="field__label" for="f-from">Desde</label>
              <input class="input input--sm" type="date" id="f-from">
            </div>

            <div class="field">
              <label class="field__label" for="f-to">Hasta</label>
              <input class="input input--sm" type="date" id="f-to">
            </div>

            <div class="filters__actions">
              <button type="button" class="btn btn--ghost btn--sm" id="btn-clear">Limpiar</button>
            </div>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th class="table__col-narrow">Cuando</th>
                  <th>Quien</th>
                  <th class="table__col-narrow">Accion</th>
                  <th>Que ocurrio</th>
                  <th class="table__col-narrow">Origen</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>

          <div class="pagination">
            <p class="pagination__info" id="page-info">—</p>
            <div class="pagination__controls" id="page-controls"></div>
          </div>

        </section>

      </div>
    </main>
  </div>

  <script type="module" src="/js/pages/audit.js"></script>
</body>
</html>
