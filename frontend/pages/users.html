<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestion de usuarios del sistema">
  <meta name="theme-color" content="#101a2e">
  <title>Usuarios · Emergency Response System</title>
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/tables.css">
</head>
<body>

  <div class="app-shell">
    <main class="app-main">
      <div class="page">

        <section class="panel panel--flush" aria-labelledby="usuarios-title">

          <div class="panel__head">
            <div>
              <h2 id="usuarios-title" class="panel__title">Usuarios</h2>
              <p class="text-muted" style="font-size: var(--text-xs);">
                Alta, edicion, roles y activacion de cuentas
              </p>
            </div>
            <div class="panel__actions">
              <button type="button" class="btn btn--ghost btn--sm" id="btn-credentials"
                      title="Hoja de accesos de demostracion (contrasenas en texto plano)">
                <span class="btn__icon" aria-hidden="true">📄</span> Excel de accesos
              </button>
              <button type="button" class="btn btn--primary btn--sm" id="btn-new">
                <span class="btn__icon" aria-hidden="true">＋</span> Nuevo usuario
              </button>
            </div>
          </div>

          <div class="filters">
            <div class="field field--search">
              <label class="field__label" for="f-search">Buscar</label>
              <span class="field--search__icon" aria-hidden="true">🔍</span>
              <input class="input" type="search" id="f-search" placeholder="Nombre, correo o documento">
            </div>

            <div class="field">
              <label class="field__label" for="f-role">Rol</label>
              <select class="select select--sm" id="f-role">
                <option value="">Todos</option>
              </select>
            </div>

            <div class="field">
              <label class="field__label" for="f-active">Estado</label>
              <select class="select select--sm" id="f-active">
                <option value="">Todos</option>
                <option value="true">Activos</option>
                <option value="false">Inactivos</option>
              </select>
            </div>

            <div class="filters__actions">
              <button type="button" class="btn btn--ghost btn--sm" id="btn-clear">Limpiar</button>
            </div>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Usuario</th>
                  <th>Documento</th>
                  <th class="table__col-narrow">Rol</th>
                  <th class="table__col-narrow">Estado</th>
                  <th class="table__col-narrow">Ultimo acceso</th>
                  <th class="table__col-actions">Acciones</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>

          <div class="pagination">
            <p class="pagination__info" id="page-info">—</p>
            <div class="pagination__controls" id="page-controls"></div>
          </div>

        </section>

      </div>
    </main>
  </div>

  <script type="module" src="/js/pages/users.js"></script>
</body>
</html>
