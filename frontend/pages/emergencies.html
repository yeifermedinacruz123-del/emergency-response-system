<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listado de emergencias">
  <meta name="theme-color" content="#101a2e">
  <title>Emergencias · Emergency Response System</title>
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div class="app-shell">
    <main class="app-main">
      <div class="page">

        <section class="panel panel--flush" aria-labelledby="listado-title">

          <div class="panel__head">
            <div>
              <h2 id="listado-title" class="panel__title">Emergencias</h2>
              <p class="text-muted" style="font-size: var(--text-xs);" id="list-subtitle">—</p>
            </div>
            <div class="page__actions">
              <button type="button" class="btn btn--ghost btn--sm" id="btn-refresh">
                <span class="btn__icon" aria-hidden="true">⟳</span> Actualizar
              </button>
            </div>
          </div>

          <!-- ============ Filtros ============ -->
          <div class="filters" id="filters">
            <div class="field field--search">
              <label class="field__label" for="f-search">Buscar</label>
              <span class="field--search__icon" aria-hidden="true">🔍</span>
              <input class="input" type="search" id="f-search" name="search"
                     placeholder="Codigo, titulo, direccion o ciudadano">
            </div>

            <div class="field" data-control-room>
              <label class="field__label" for="f-status">Estado</label>
              <select class="select select--sm" id="f-status" name="status">
                <option value="">Todos</option>
              </select>
            </div>

            <div class="field">
              <label class="field__label" for="f-type">Tipo</label>
              <select class="select select--sm" id="f-type" name="type">
                <option value="">Todos</option>
              </select>
            </div>

            <div class="field" data-control-room>
              <label class="field__label" for="f-priority">Prioridad</label>
              <select class="select select--sm" id="f-priority" name="priority">
                <option value="">Todas</option>
              </select>
            </div>

            <div class="field" data-control-room>
              <label class="field__label" for="f-zone">Zona</label>
              <select class="select select--sm" id="f-zone" name="zone">
                <option value="">Todas</option>
              </select>
            </div>

            <div class="field" data-control-room>
              <label class="field__label" for="f-sos">SOS</label>
              <select class="select select--sm" id="f-sos" name="sos">
                <option value="">Todas</option>
                <option value="true">Solo SOS</option>
                <option value="false">Sin SOS</option>
              </select>
            </div>

            <div class="filters__actions">
              <span class="filters__count" id="filters-count" hidden></span>
              <button type="button" class="btn btn--ghost btn--sm" id="btn-clear">Limpiar</button>
            </div>
          </div>

          <!-- ============ Tabla ============ -->
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th class="table__col-code">
                    <button type="button" class="table__sort" data-sort="code">
                      Codigo <span class="table__sort-icon" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>Emergencia</th>
                  <th data-control-room>Ciudadano</th>
                  <th class="table__col-narrow">
                    <button type="button" class="table__sort" data-sort="priority">
                      Prioridad <span class="table__sort-icon" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th class="table__col-narrow">Estado</th>
                  <th class="table__col-narrow">Personal</th>
                  <th class="table__col-narrow">
                    <button type="button" class="table__sort is-sorted" data-sort="reported">
                      Reportada <span class="table__sort-icon" aria-hidden="true">↓</span>
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>

          <!-- ============ Paginacion ============ -->
          <div class="pagination">
            <p class="pagination__info" id="page-info">—</p>
            <div class="pagination__controls" id="page-controls"></div>
          </div>

        </section>

      </div>
    </main>
  </div>

  <script type="module" src="/js/pages/emergencies.js"></script>
</body>
</html>
