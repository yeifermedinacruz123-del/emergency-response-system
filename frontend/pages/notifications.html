<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bandeja de notificaciones del sistema">
  <meta name="theme-color" content="#101a2e">
  <title>Notificaciones · Emergency Response System</title>
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>

  <div class="app-shell">
    <main class="app-main">
      <div class="page">

        <!-- ============ Notificaciones del navegador (push) ============ -->
        <section class="panel" aria-labelledby="push-title" id="push-section" hidden>
          <div class="panel__head">
            <div>
              <h2 id="push-title" class="panel__title">Notificaciones del navegador</h2>
              <p class="text-muted" style="font-size: var(--text-xs);" id="push-state">
                Comprobando…
              </p>
            </div>
            <div class="panel__actions">
              <button type="button" class="btn btn--ghost btn--sm" id="btn-push-test" hidden>
                Enviar prueba
              </button>
              <button type="button" class="btn btn--primary btn--sm" id="btn-push" hidden>
                Activar
              </button>
            </div>
          </div>
        </section>

        <!-- ============ Bandeja ============ -->
        <section class="panel panel--flush" aria-labelledby="notif-title">

          <div class="panel__head">
            <div>
              <h2 id="notif-title" class="panel__title">Notificaciones</h2>
              <p class="text-muted" style="font-size: var(--text-xs);" id="summary">Cargando…</p>
            </div>
            <div class="panel__actions">
              <button type="button" class="btn btn--ghost btn--sm" id="btn-refresh">
                <span class="btn__icon" aria-hidden="true">⟳</span> Actualizar
              </button>
              <button type="button" class="btn btn--primary btn--sm" id="btn-read-all">
                Marcar todas como leidas
              </button>
            </div>
          </div>

          <div class="filters">
            <div class="field">
              <label class="field__label" for="f-state">Mostrar</label>
              <select class="select select--sm" id="f-state">
                <option value="">Todas</option>
                <option value="unread">Solo sin leer</option>
              </select>
            </div>
          </div>

          <div class="notif-list" id="list"></div>

          <div class="pagination">
            <p class="pagination__info" id="page-info">—</p>
            <div class="pagination__controls" id="page-controls"></div>
          </div>

        </section>

      </div>
    </main>
  </div>

  <script type="module" src="/js/pages/notifications.js"></script>
</body>
</html>
