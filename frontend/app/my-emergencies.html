<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mis reportes de emergencia">
  <meta name="theme-color" content="#101a2e">

  <title>ERS · Mis reportes</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="app-mobile">

  <header class="m-header">
    <div>
      <p class="m-header__title">Mis reportes</p>
      <p class="m-header__subtitle" id="summary">—</p>
    </div>
  </header>

  <p class="offline-banner" id="offline-banner">
    <span aria-hidden="true">⚠</span> Sin conexion
  </p>

  <main class="m-main">

    <div class="field" style="margin-bottom: var(--space-5);">
      <select class="select" id="f-status" aria-label="Filtrar por estado">
        <option value="">Todos mis reportes</option>
        <option value="PENDIENTE">Pendientes</option>
        <option value="EN_PROCESO">En proceso</option>
        <option value="RESUELTO">Resueltos</option>
        <option value="CANCELADO">Cancelados</option>
      </select>
    </div>

    <div id="list"></div>

    <button type="button" class="btn btn--ghost btn--block" id="btn-more" hidden
            style="margin-top: var(--space-4);">
      Cargar mas
    </button>

  </main>

  <script type="module" src="/js/mobile/my-emergencies.js"></script>
</body>
</html>
