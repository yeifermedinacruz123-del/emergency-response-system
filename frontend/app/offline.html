<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sin conexion">
  <meta name="theme-color" content="#101a2e">

  <title>ERS · Sin conexion</title>

  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="app-mobile" style="padding-bottom: 0;">

  <main class="m-main" style="display: flex; align-items: center; justify-content: center;">
    <div class="m-empty">
      <span class="m-empty__icon" aria-hidden="true">📡</span>
      <p class="m-empty__title">Sin conexion</p>
      <p class="m-empty__text">
        No pudimos cargar esta pantalla porque no hay red y todavia no estaba
        guardada en el telefono.
      </p>

      <div class="card" style="margin-top: var(--space-5); text-align: left;">
        <p style="font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-strong); margin-bottom: var(--space-2);">
          Si es una emergencia real
        </p>
        <p style="font-size: var(--text-sm); color: var(--text-muted); line-height: 1.5;">
          No esperes a recuperar la conexion: llama directamente a la linea
          nacional de emergencias.
        </p>
        <a href="tel:123" class="btn btn--danger btn--block" style="margin-top: var(--space-3);">
          <span class="btn__icon" aria-hidden="true">📞</span> Llamar al 123
        </a>
      </div>

      <button type="button" class="btn btn--ghost btn--block" id="btn-retry"
              style="margin-top: var(--space-4);">
        <span class="btn__icon" aria-hidden="true">⟳</span> Reintentar
      </button>
    </div>
  </main>

  <script>
    // Sin modulos ni dependencias: esta pagina debe funcionar cuando todo lo
    // demas ha fallado.
    document.getElementById('btn-retry').addEventListener('click', function () {
      window.location.reload();
    });

    // En cuanto vuelva la red, se recarga sola.
    window.addEventListener('online', function () {
      window.location.reload();
    });
  </script>
</body>
</html>
