<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mis avisos">
  <meta name="theme-color" content="#101a2e">

  <title>ERS · Avisos</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="app-mobile">

  <header class="m-header">
    <div>
      <p class="m-header__title">Avisos</p>
      <p class="m-header__subtitle" id="summary">—</p>
    </div>
    <div class="m-header__actions">
      <button type="button" class="m-header__btn" id="btn-read-all" aria-label="Marcar todo como leido">
        <span aria-hidden="true">✓</span>
      </button>
    </div>
  </header>

  <p class="offline-banner" id="offline-banner">
    <span aria-hidden="true">⚠</span> Sin conexion
  </p>

  <main class="m-main">

    <!-- ============ Notificaciones del telefono ============ -->
    <section class="m-section" id="push-section" hidden>
      <div class="card">
        <div class="row row-between" style="gap: var(--space-3); align-items: flex-start;">
          <div style="min-width: 0;">
            <p style="font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-strong);">
              Avisos en el telefono
            </p>
            <p style="font-size: var(--text-xs); color: var(--text-muted); line-height: 1.5; margin-top: 2px;"
               id="push-state">Comprobando…</p>
          </div>
          <button type="button" class="btn btn--primary btn--sm" id="btn-push" hidden>Activar</button>
        </div>
        <button type="button" class="btn btn--ghost btn--sm btn--block" id="btn-push-test"
                hidden style="margin-top: var(--space-3);">
          Enviar una notificacion de prueba
        </button>
      </div>
    </section>

    <div id="list"></div>
    <button type="button" class="btn btn--ghost btn--block" id="btn-more" hidden
            style="margin-top: var(--space-4);">
      Cargar mas
    </button>
  </main>

  <script type="module" src="/js/mobile/notifications.js"></script>
</body>
</html>
